<script>
function formatDate(d) {
  if (!d) return "—";
  const date = new Date(d);
  return isNaN(date.getTime()) ? "—" : date.toLocaleString();
}

async function loadAdminData() {
  try {
    const res = await fetch("/api/admin/stats");
    const data = await res.json();
    if (!data.success) return;

    // Volunteers Table
    document.getElementById("volunteersTable").innerHTML = data.recent_volunteers.map(r => `
      <tr>
        <td><strong>${r.name}</strong></td>
        <td>${r.email || "—"}</td>
        <td><span class="badge">${r.interest_area}</span></td>
        <td>${formatDate(r.created_at)}</td>
      </tr>
    `).join("") || "<tr><td colspan='4'>No records found.</td></tr>";

    // Donor Inquiries Table
    document.getElementById("donorsTable").innerHTML = data.recent_donor_inquiries.map(r => `
      <tr>
        <td><strong>${r.name}</strong></td>
        <td>${r.email || "—"}</td>
        <td>${r.category}</td>
        <td><strong>${r.currency} ${r.amount}</strong></td>
        <td>${formatDate(r.created_at)}</td>
      </tr>
    `).join("") || "<tr><td colspan='5'>No records found.</td></tr>";

    // Feedback Table
    document.getElementById("feedbackTable").innerHTML = data.recent_feedback.map(r => `
      <tr>
        <td><strong>${r.name}</strong></td>
        <td>${r.email || "—"}</td>
        <td><em>${r.message}</em></td>
        <td>${formatDate(r.created_at)}</td>
      </tr>
    `).join("") || "<tr><td colspan='4'>No records found.</td></tr>";
  } catch (err) {
    console.error("Error loading admin data:", err);
  }
}

loadAdminData();
setInterval(loadAdminData, 30000);
</script>
